<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<style>
:root{
  --pink:#ff4f91; --purple:#8b5cf6; --yellow:#ffd166; --cyan:#43d9ff;
  --ink:#2a1747; --glass:rgba(255,255,255,.72);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#10051e;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
body{overflow:hidden}
#scene{
  position:relative; width:100%; height:1040px; overflow:hidden;
  background:
    radial-gradient(circle at 20% 10%,rgba(255,90,170,.42),transparent 28%),
    radial-gradient(circle at 85% 15%,rgba(67,217,255,.30),transparent 30%),
    radial-gradient(circle at 50% 80%,rgba(139,92,246,.30),transparent 35%),
    linear-gradient(145deg,#18062b,#3a0c53 52%,#12051f);
}
#stars{position:absolute;inset:0;opacity:.8}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:white;box-shadow:0 0 12px white;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.4)}}

.content{position:relative;z-index:10;max-width:980px;margin:auto;padding:38px 22px;text-align:center}
.badge{
 display:inline-block;padding:8px 16px;border-radius:999px;color:white;
 background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
 backdrop-filter:blur(10px);letter-spacing:2px;font-size:12px;font-weight:800;
}
h1{
 margin:16px 0 4px;color:white;font-size:clamp(46px,8vw,92px);line-height:.95;
 font-weight:950;letter-spacing:-4px;
 text-shadow:0 8px 35px rgba(0,0,0,.25);
}
.name{
 background:linear-gradient(90deg,#ffd166,#ff7ab6,#b88cff,#54e6ff,#ffd166);
 background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
 animation:gradient 5s linear infinite;
}
@keyframes gradient{to{background-position:300% 0}}
.subtitle{color:#fceeff;font-size:clamp(16px,2.2vw,22px);margin:12px auto 22px;max-width:650px}

.card{
 max-width:780px;margin:0 auto;padding:22px;border-radius:30px;
 background:var(--glass);backdrop-filter:blur(18px);
 border:1px solid rgba(255,255,255,.5);
 box-shadow:0 30px 80px rgba(0,0,0,.28);
}
.message{font-size:18px;line-height:1.55;margin:0 0 16px}
.hint{font-size:13px;opacity:.65;margin:5px 0 0}

.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
button{
 border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;
 color:white;background:linear-gradient(135deg,var(--pink),var(--purple));
 box-shadow:0 8px 22px rgba(139,92,246,.3);transition:.2s transform,.2s filter;
}
button:hover{transform:translateY(-2px);filter:brightness(1.08)}
button.secondary{background:rgba(42,23,71,.1);color:var(--ink);border:1px solid rgba(42,23,71,.15);box-shadow:none}

.cake-wrap{position:relative;width:300px;height:260px;margin:12px auto 0;cursor:pointer;filter:drop-shadow(0 20px 22px rgba(0,0,0,.2))}
.cake{position:absolute;left:35px;right:35px;bottom:25px;height:105px;border-radius:22px 22px 30px 30px;
 background:linear-gradient(#ff9bbf 0 18%,#ff6eaa 18% 100%);
 box-shadow:inset 0 -12px 0 rgba(255,255,255,.12)}
.cake:before{content:"";position:absolute;left:0;right:0;top:-18px;height:35px;border-radius:50%;
 background:#fff0f6;box-shadow:0 10px 0 #ff8fbd}
.drip{position:absolute;top:2px;width:22px;height:36px;background:#fff0f6;border-radius:0 0 14px 14px}
.d1{left:38px}.d2{left:105px;height:27px}.d3{right:48px;height:42px}
.plate{position:absolute;left:15px;right:15px;bottom:8px;height:20px;border-radius:50%;background:#d9c5ff}
.candle{position:absolute;bottom:130px;width:13px;height:55px;border-radius:5px;background:repeating-linear-gradient(135deg,#fff 0 7px,#ff6eaa 7px 14px)}
.c1{left:82px}.c2{left:143px}.c3{right:82px}
.flame{position:absolute;bottom:184px;width:18px;height:28px;border-radius:50% 50% 50% 50%;background:radial-gradient(circle at 50% 65%,#fff 0 15%,#ffd166 16% 55%,#ff7a00 56%);
animation:flicker .12s infinite alternate;filter:drop-shadow(0 0 10px #ffd166)}
.f1{left:80px}.f2{left:141px}.f3{right:80px}
@keyframes flicker{to{transform:scale(1.08) rotate(2deg)}}
.blown .flame{display:none}
.cake-cut{animation:cutcake .7s ease forwards}
@keyframes cutcake{50%{transform:rotate(-2deg) scale(1.04)}100%{transform:translateY(8px) scale(.98)}}

.balloon{
 position:absolute;width:58px;height:72px;border-radius:50% 50% 45% 45%;
 cursor:pointer;z-index:5;box-shadow:inset -10px -12px 20px rgba(0,0,0,.13);
 animation:float 4s ease-in-out infinite;
}
.balloon:after{content:"";position:absolute;left:50%;top:70px;width:1px;height:130px;background:rgba(255,255,255,.55)}
.balloon:before{content:"";position:absolute;left:22px;bottom:-7px;border:7px solid transparent;border-top-color:currentColor}
.b1{left:4%;top:28%;background:#ff5b8d;color:#ff5b8d}.b2{right:5%;top:35%;background:#48d9ff;color:#48d9ff;animation-delay:-1s}.b3{left:9%;top:62%;background:#ffd166;color:#ffd166;animation-delay:-2s}.b4{right:10%;top:65%;background:#a98bff;color:#a98bff;animation-delay:-3s}
@keyframes float{50%{transform:translateY(-20px) rotate(3deg)}}
.popped{animation:pop .25s forwards!important}
@keyframes pop{to{transform:scale(1.7);opacity:0}}

#confetti,#fx{position:absolute;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf{
 position:absolute;width:9px;height:15px;opacity:.95;animation:fall 1.9s linear forwards;
}
@keyframes fall{to{transform:translate3d(var(--x),1050px,0) rotate(900deg);opacity:.1}}
.spark{
 position:absolute;width:8px;height:8px;border-radius:50%;background:white;
 animation:spark .75s ease-out forwards;box-shadow:0 0 16px white;
}
@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

.footer{margin-top:8px;color:rgba(255,255,255,.72);font-size:12px}
#from{font-weight:800}
@media(max-width:600px){
 body{overflow:auto} #scene{height:1040px}
 .content{padding-top:28px}.card{padding:16px}.cake-wrap{transform:scale(.9);margin-top:-5px}
 .balloon{transform:scale(.72)}.b1{left:1%}.b2{right:1%}
}
</style>
</head>
<body>
<div id="scene">
  <div id="stars"></div>
  <div id="confetti"></div><div id="fx"></div>

  <div class="balloon b1" title="Pop me!"></div>
  <div class="balloon b2" title="Pop me!"></div>
  <div class="balloon b3" title="Pop me!"></div>
  <div class="balloon b4" title="Pop me!"></div>

  <main class="content">
    <div class="badge">✨ A LITTLE SURPRISE ✨</div>
    <h1>Happy Bruhhthday,<br><span class="name">{{MONICA VASIREDDY DON}}</span>! 🎉</h1>
    <p class="subtitle">Today is my day! OH sorry yours. Make a wish, smile big, and enjoy every little moment. 💖</p>

    <section class="card">
      <p class="message">“{{MESSAGE}}”</p>

      <div class="cake-wrap" id="cake" title="Click the cake to cut it!">
        <div class="candle c1"></div><div class="candle c2"></div><div class="candle c3"></div>
        <div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div>
        <div class="cake"><span class="drip d1"></span><span class="drip d2"></span><span class="drip d3"></span></div>
        <div class="plate"></div>
      </div>

      <p class="hint">🎂 the cake cut it or not • 🎈 balloons pop them • 🎆 Click anywhere </p>

      <div class="actions">
        <button id="wish">✨ Make a Wish</button>
        <button id="blow" class="secondary">🕯️ Blow Candles</button>
        <button id="music" class="secondary">🎵 Birthday Music</button>
      </div>

      <div class="footer">Made with ❤️ <span id="from">BADASS</span></div>
    </section>
  </main>
</div>

<script>
const confetti = document.getElementById("confetti");
const fx = document.getElementById("fx");
const colors = ["#ff4f91","#ffd166","#43d9ff","#8b5cf6","#7ee081","#ffffff"];

function burst(count=130){
  for(let i=0;i<count;i++){
    const e=document.createElement("div"); e.className="conf";
    e.style.left=(45+Math.random()*10)+"%"; e.style.top=(25+Math.random()*12)+"%";
    e.style.background=colors[Math.floor(Math.random()*colors.length)];
    e.style.setProperty("--x",((Math.random()-.5)*900)+"px");
    e.style.animationDelay=(Math.random()*.35)+"s";
    e.style.transform=`rotate(${Math.random()*360}deg)`;
    confetti.appendChild(e); setTimeout(()=>e.remove(),2400);
  }
}

function sparks(x,y){
  for(let i=0;i<22;i++){
    const s=document.createElement("div"); s.className="spark";
    s.style.left=x+"px"; s.style.top=y+"px";
    const a=Math.random()*Math.PI*2, r=60+Math.random()*150;
    s.style.setProperty("--x",Math.cos(a)*r+"px");
    s.style.setProperty("--y",Math.sin(a)*r+"px");
    fx.appendChild(s); setTimeout(()=>s.remove(),800);
  }
}

function fireworks(){
  const r=document.getElementById("scene").getBoundingClientRect();
  sparks(Math.random()*r.width,180+Math.random()*360);
}

document.querySelectorAll(".balloon").forEach(b=>{
  b.addEventListener("click",e=>{
    e.stopPropagation();
    b.classList.add("popped"); sparks(e.clientX,e.clientY); burst(35);
    setTimeout(()=>b.remove(),250);
  });
});

document.getElementById("cake").addEventListener("click",e=>{
  e.stopPropagation();
  document.getElementById("cake").classList.add("cake-cut");
  burst(180); sparks(e.clientX,e.clientY);
});

document.getElementById("wish").addEventListener("click",()=>{
  burst(220); fireworks();
  alert("🌟 Wish made! May it come true! 🎂✨");
});

document.getElementById("blow").addEventListener("click",()=>{
  document.getElementById("cake").classList.add("blown");
  burst(150);
});

document.getElementById("scene").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON") fireworks();
});

// Tiny star field
for(let i=0;i<90;i++){
  const s=document.createElement("span");s.className="star";
  s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(Math.random()*2)+"s";document.getElementById("stars").appendChild(s);
}

// Web Audio birthday-ish melody; starts only after user clicks.
let audioCtx=null;
function playTone(freq,start,duration){
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.type="sine";o.frequency.value=freq;g.gain.setValueAtTime(.0001,start);
  g.gain.exponentialRampToValueAtTime(.18,start+.02);
  g.gain.exponentialRampToValueAtTime(.0001,start+duration);
  o.connect(g);g.connect(audioCtx.destination);o.start(start);o.stop(start+duration+.03);
}
document.getElementById("music").addEventListener("click",()=>{
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  const t=audioCtx.currentTime+.05;
  // Happy Birthday opening melody, transposed.
  const notes=[264,264,297,264,352,330,264,264,297,264,396,352,260,230,340,261,280,250,240,230,210,100];
  notes.forEach((n,i)=>playTone(n,t+i*.28,.23));
  burst(100);
});
</script>
</body>
</html>
